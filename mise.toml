[settings]
experimental = true
quiet = true
task_output = "interleave"
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.1"
"aqua:shenwei356/rush" = "0.9.0"
jq = "1.8.1"
usage = "1"
"pipx:check-jsonschema" = "0.36.0"
"shiv:codebase" = "0.4"
"shiv:desks" = "0.1"
"shiv:readme" = "0.3"
# Needs sessions >= v0.4.7 for persistent non-headless wake --message.
"shiv:sessions" = "0.4"

[_.codebase]
name = "sphincters"
lint = ["@all"]
