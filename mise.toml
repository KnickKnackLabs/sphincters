[settings]
experimental = true
quiet = true
task_output = "interleave"

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
bats = "1.13.0"
jq = "1.8.1"
usage = "1"
"pipx:check-jsonschema" = "0.36.0"
"shiv:codebase" = "0.3"
"shiv:desks" = "0.1"
"shiv:readme" = "0.3"
# Needs sessions >= v0.4.7 for persistent non-headless wake --message.
"shiv:sessions" = "0.4"

[_.codebase]
lint = [
  "mise-settings",
  "bats-test-helper",
  "bats-test-task",
  "mcr-scope",
  "or-true",
  "shellcheck",
  "github-actions",
]
