[settings]
experimental = true
quiet = true
task_output = "interleave"

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
bats = "1.13.0"
jq = "1.8.1"
usage = "1"
"shiv:codebase" = "0.2.0"
# Track latest sessions while its system-prompt handoff surface is still moving.
"shiv:sessions" = "latest"

[_.codebase]
lint = ["mise-settings", "bats-test-helper", "bats-test-task", "mcr-scope", "or-true", "shellcheck"]
